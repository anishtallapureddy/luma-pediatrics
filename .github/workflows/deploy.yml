name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [pulse-snapshot-updated]
  schedule:
    # Daily rebuild at 14:00 UTC (9am CDT / 8am CST) — picks up any drift
    # from the Luma Pulse snapshot even without an explicit dispatch.
    - cron: '0 14 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build Astro site
        env:
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.GOOGLE_MAPS_BROWSER_API_KEY || '' }}
        run: npm run build

      - name: Verify analytics, metadata, and sitemap
        run: npm run check:seo

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: 68a3f60f6888a5a9ed55db78c80dda34
          SITE_URL: https://www.lumapediatrics.com
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          site = os.environ["SITE_URL"]
          key = os.environ["INDEXNOW_KEY"]

          with urllib.request.urlopen(f"{site}/sitemap-0.xml", timeout=30) as response:
              sitemap = ET.fromstring(response.read())

          namespace = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text for node in sitemap.findall("s:url/s:loc", namespace) if node.text]
          payload = json.dumps({
              "host": "www.lumapediatrics.com",
              "key": key,
              "keyLocation": f"{site}/{key}.txt",
              "urlList": urls,
          }).encode()
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"IndexNow accepted {len(urls)} URLs with status {response.status}.")
          PY
