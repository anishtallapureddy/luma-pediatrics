name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [pulse-snapshot-updated]
  schedule:
    # Daily rebuild at 14:00 UTC (9am CDT / 8am CST) — picks up any drift
    # from the Luma Pulse snapshot even without an explicit dispatch.
    - cron: '0 14 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Astro site
        env:
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_API_KEY }}
        run: npm run build

      - name: Verify analytics, metadata, and sitemap
        run: npm run check:seo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: 68a3f60f6888a5a9ed55db78c80dda34
          SITE_URL: https://www.lumapediatrics.com
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          site = os.environ["SITE_URL"]
          key = os.environ["INDEXNOW_KEY"]

          with urllib.request.urlopen(f"{site}/sitemap-0.xml", timeout=30) as response:
              sitemap = ET.fromstring(response.read())

          namespace = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text for node in sitemap.findall("s:url/s:loc", namespace) if node.text]
          payload = json.dumps({
              "host": "www.lumapediatrics.com",
              "key": key,
              "keyLocation": f"{site}/{key}.txt",
              "urlList": urls,
          }).encode()
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"IndexNow accepted {len(urls)} URLs with status {response.status}.")
          PY
